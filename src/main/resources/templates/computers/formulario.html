<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Computadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${computer.id == null ? 'Nueva Computadora' : 'Editar Computadora'}"></h2>
    <hr>

    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
        Por favor, corrige los errores en el formulario asegurándote de ingresar datos válidos (solo números en los campos correspondientes).
    </div>

    <form th:action="@{/computers/save}" th:object="${computer}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Marca</label>
                <input type="text" class="form-control" th:field="*{brand}" th:errorclass="is-invalid" placeholder="Ej. Dell, HP">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Categoría</label>
                <select class="form-select" th:field="*{category}" th:errorclass="is-invalid">
                    <option value="LAPTOP">Laptop</option>
                    <option value="DESKTOP">Desktop</option>
                    <option value="SERVER">Server</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Marca CPU</label>
                <input type="text" class="form-control" th:field="*{cpuBrand}" th:errorclass="is-invalid" placeholder="Ej. Intel Core i7">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('cpuBrand')}" th:errors="*{cpuBrand}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Velocidad CPU (GHz)</label>
                <!-- type="number" y step="0.01" bloquean texto y obligan formato decimal en el navegador -->
                <input type="number" step="0.01" min="0" class="form-control" th:field="*{cpuSpeed}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('cpuSpeed')}" th:errors="*{cpuSpeed}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Capacidad RAM (GB)</label>
                <input type="number" step="1" min="1" class="form-control" th:field="*{ramCapacity}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('ramCapacity')}" th:errors="*{ramCapacity}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Tecnología RAM</label>
                <select class="form-select" th:field="*{ramTechnology}" th:errorclass="is-invalid">
                    <option value="DDR4">DDR4</option>
                    <option value="DDR5">DDR5</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('ramTechnology')}" th:errors="*{ramTechnology}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Precio ($)</label>
                <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Capacidad Disco (GB)</label>
                <input type="number" step="1" min="1" class="form-control" th:field="*{diskCapacity}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('diskCapacity')}" th:errors="*{diskCapacity}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Tecnología Disco</label>
                <select class="form-select" th:field="*{diskTechnology}" th:errorclass="is-invalid">
                    <option value="SSD">SSD</option>
                    <option value="HDD">HDD</option>
                    <option value="NVME">NVMe</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('diskTechnology')}" th:errors="*{diskTechnology}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Marca Monitor</label>
                <input type="text" class="form-control" th:field="*{monitorBrand}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('monitorBrand')}" th:errors="*{monitorBrand}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Pulgadas Monitor</label>
                <input type="number" step="0.01" min="0" max="80" class="form-control" th:field="*{inches}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('inches')}" th:errors="*{inches}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Puertos HDMI</label>
                <input type="number" step="1" min="0" class="form-control" th:field="*{hdmiPorts}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('hdmiPorts')}" th:errors="*{hdmiPorts}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Puertos USB</label>
                <input type="number" step="1" min="0" class="form-control" th:field="*{usbPorts}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('usbPorts')}" th:errors="*{usbPorts}"></div>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Guardar Computadora</button>
        <a th:href="@{/computers}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
