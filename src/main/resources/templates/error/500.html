<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error interno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container text-center">
    <h1 class="display-1 text-danger fw-bold">500</h1>
    <h3 class="mb-4">Error interno del servidor</h3>
    <div class="alert alert-danger d-inline-block shadow" role="alert">
        <strong th:text="${errorMessage}"></strong>
    </div>
    <div class="mt-4">
        <a th:href="@{/usuarios/lista}" class="btn btn-primary">Regresar al inicio</a>
    </div>
</div>
</body>
</html>
