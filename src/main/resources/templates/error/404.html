<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuario no encontrado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container text-center">
    <h1 class="display-1 text-warning fw-bold">404</h1>
    <h3 class="mb-4">Recurso no encontrado</h3>

    <div class="alert alert-warning d-inline-block shadow" role="alert">
        <strong th:text="${errorMessage}"></strong>
    </div>

    <div class="mt-4">
        <a th:href="@{/usuarios/lista}" class="btn btn-primary">Regresar al inicio</a>
    </div>
</div>

</body>
</html>
