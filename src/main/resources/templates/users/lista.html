<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal - Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Panel de Control</span>
        <div class="d-flex">
            <a th:href="@{/usuarios/nuevo}" class="btn btn-success me-2">+ Nuevo Usuario</a>
            <a th:href="@{/usuarios/lista}" class="btn btn-outline-light me-2">Ver Todos</a>
            <a th:href="@{/computers/list}" class="btn btn-outline-light me-2">Inventario de Computadores</a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Opciones de Búsqueda</h2>

    <div class="row mb-4">
        <div class="col-md-4">
            <form th:action="@{/usuarios/buscar/nombre}" method="get" class="d-flex shadow-sm">
                <input type="text" name="nombre" class="form-control me-2" placeholder="Buscar por Nombre..." required>
                <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
        </div>
        <div class="col-md-4">
            <form th:action="@{/usuarios/buscar/apellido}" method="get" class="d-flex shadow-sm">
                <input type="text" name="apellido" class="form-control me-2" placeholder="Buscar por Apellido..." required>
                <button type="submit" class="btn btn-secondary">Buscar</button>
            </form>
        </div>
        <div class="col-md-4">
            <form th:action="@{/usuarios/tipo}" method="get" class="d-flex shadow-sm">
                <select name="tipo" class="form-select me-2" required>
                    <option value="" disabled selected>Filtrar por Tipo...</option>
                    <option value="CLIENTE">Clientes</option>
                    <option value="ADMIN">Administradores</option>
                </select>
                <button type="submit" class="btn btn-info">Filtrar</button>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Resultados del Sistema</h5>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primary btn-sm">+ Agregar Usuario</a>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.name}"></td>
                    <td th:text="${u.lastName}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${u.type}"></span>
                    </td>
                    <td class="text-center">

                        <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-warning">Editar</a>

                        <form th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Confirma la eliminación del usuario?');">
                            <button type="submit" class="btn btn-sm btn-danger">Borrar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6" class="text-center text-muted py-4">No se encontraron usuarios en la base de datos.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
