<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.id == null ? 'Nuevo Registro' : 'Editar Información'}">Gestión de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${user.id == null ? 'Registrar Nuevo Usuario' : 'Editar Información Básica'}"></h4>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="${user.id == null ? '/usuarios/guardar' : '/usuarios/actualizar/' + user.id}"
                          th:object="${user}" method="post">


                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{name}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   required>

                            <div th:if="${#fields.hasErrors('name')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{name}">
                                Error en el nombre
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{lastName}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('lastName')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{lastName}">
                                Error en el apellido
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('email')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{email}">
                                Error en el correo
                            </div>
                        </div>

                        <div class="mb-3" th:if="${user.id == null}">
                            <label class="form-label">Tipo de Usuario</label>
                            <select th:field="*{type}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('type')} ? 'is-invalid' : ''">
                                <option th:each="role : ${roles != null ? roles : T(org.exercise7.model.enums.TypeUser).values()}"
                                        th:value="${role}"
                                        th:text="${role}">CLIENTE</option>
                            </select>
                            <div th:if="${#fields.hasErrors('type')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{type}">
                                Error en el tipo de usuario
                            </div>
                        </div>

                        <div class="mb-4" th:if="${user.id == null}">
                            <label class="form-label">Contraseña</label>
                            <input type="password" th:field="*{password}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('password')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{password}">
                                Error en la contraseña
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success"
                                    th:text="${user.id == null ? 'Crear Cuenta' : 'Guardar Cambios'}"></button>

                            <a th:href="@{/usuarios/lista}"
                               class="btn btn-secondary">Cancelar y Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
