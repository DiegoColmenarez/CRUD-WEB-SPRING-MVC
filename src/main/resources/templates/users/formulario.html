<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Título dinámico -->
    <title th:text="${user.id == null ? 'Nuevo Registro' : 'Editar Información'}">Gestión de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${user.id == null ? 'Registrar Nuevo Usuario' : 'Editar Información Básica'}"></h4>
                </div>
                <div class="card-body">


                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>


                    <form th:action="${user.id == null ? '/usuarios/guardar' : '/usuarios/actualizar/' + user.id}"
                          th:object="${user}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{lastName}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>

                        <div class="mb-4" th:if="${user.id == null}">
                            <label class="form-label">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success" th:text="${user.id == null ? 'Crear Cuenta' : 'Guardar Cambios'}"></button>

                            <a th:href="@{${user.id == null ? '/login' : '/usuarios/lista'}}" class="btn btn-secondary">Cancelar y Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
