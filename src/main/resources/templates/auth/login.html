<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header bg-dark text-white text-center">
                    <h3 class="font-weight-light my-2">Acceso al Sistema</h3>
                </div>
                <div class="card-body">
                    <!-- Alertas de Spring Security -->
                    <div th:if="${param.error}" class="alert alert-danger">Credenciales incorrectas.</div>
                    <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-floating mb-3">
                            <input class="form-control" name="username" type="email" placeholder="nombre@ejemplo.com" required autofocus/>
                            <label>Correo Electrónico</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input class="form-control" name="password" type="password" placeholder="Contraseña" required/>
                            <label>Contraseña</label>
                        </div>
                        <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <div class="small"><a th:href="@{/usuarios/nuevo}">¿Necesitas una cuenta? Regístrate aquí</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
