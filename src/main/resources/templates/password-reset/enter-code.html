<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verificar Código</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-dark text-white text-center">
                    <h3 class="my-2">Verificar Código</h3>
                </div>
                <div class="card-body">
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <p class="text-muted small">Introduce el código de 6 dígitos que enviamos a tu correo.</p>

                    <form th:action="@{/password-reset/verify-code}" method="post">
                        <div class="form-floating mb-3">
                            <input class="form-control" name="code" type="text"
                                   pattern="\d{6}" maxlength="6"
                                   placeholder="000000" required autofocus>
                            <label>Código de 6 dígitos</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Verificar</button>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <a th:href="@{/password-reset}" class="small">¿No recibiste el código? Reenviar</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
