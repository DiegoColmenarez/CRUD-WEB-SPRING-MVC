<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-dark text-white text-center">
                    <h3 class="my-2">Nueva Contraseña</h3>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/password-reset/update-password}"
                          th:object="${passwordResetRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Nueva Contraseña</label>
                            <input type="password" th:field="*{password}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('password')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{password}">Error</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirmar Contraseña</label>
                            <input type="password" th:field="*{confirmPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('confirmPassword')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{confirmPassword}">Error</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Cambiar Contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
