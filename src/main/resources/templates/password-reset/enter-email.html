<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-dark text-white text-center">
                    <h3 class="my-2">Recuperar Contraseña</h3>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <p class="text-muted small">Introduce tu correo y te enviaremos un código de verificación.</p>

                    <form th:action="@{/password-reset/send-code}" method="post">
                        <div class="form-floating mb-3">
                            <input class="form-control" name="email" type="email"
                                   placeholder="nombre@ejemplo.com" required autofocus>
                            <label>Correo Electrónico</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Enviar Código</button>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <a th:href="@{/login}" class="small">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
