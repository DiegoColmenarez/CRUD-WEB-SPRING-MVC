<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${computer.id == null ? 'Nuevo Registro' : 'Editar Información'}">Gestión de Computadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${computer.id == null ? 'Registrar Nuevo Equipo' : 'Editar Información Básica'}"></h4>
                </div>
                <div class="card-body">

                    <div th:if="${businessError}" class="alert alert-danger" th:text="${businessError}"></div>

                    <form th:action="@{/computers/save}" th:object="${computer}" method="post">

                        <input type="hidden" th:field="*{id}" th:if="${computer.id != null}"/>

                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" th:field="*{brand}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('brand')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{brand}">
                                Error en la marca
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select th:field="*{category}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.value}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('category')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{category}">
                                Error en categoría
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Marca CPU</label>
                            <input type="text" th:field="*{cpuBrand}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('cpuBrand')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('cpuBrand')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{cpuBrand}">
                                Error en CPU
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Velocidad CPU</label>
                            <input type="text" th:field="*{cpuSpeed}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('cpuSpeed')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('cpuSpeed')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{cpuSpeed}">
                                Error en velocidad
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tecnología RAM</label>
                            <select th:field="*{ramTechnology}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('ramTechnology')} ? 'is-invalid' : ''" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option th:each="ram : ${ramTechnologies}" th:value="${ram}" th:text="${ram.value}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('ramTechnology')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{ramTechnology}">
                                Error en RAM
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Capacidad RAM</label>
                            <input type="text" th:field="*{ramCapacity}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('ramCapacity')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('ramCapacity')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{ramCapacity}">
                                Error en capacidad RAM
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tecnología Disco</label>
                            <select th:field="*{diskTechnology}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('diskTechnology')} ? 'is-invalid' : ''" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option th:each="disk : ${diskTechnologies}" th:value="${disk}" th:text="${disk.name()}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('diskTechnology')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{diskTechnology}">
                                Error en disco
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Capacidad Disco</label>
                            <input type="text" th:field="*{diskCapacity}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('diskCapacity')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('diskCapacity')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{diskCapacity}">
                                Error en capacidad de disco
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Puertos USB</label>
                            <input type="number" th:field="*{usbPorts}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('usbPorts')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('usbPorts')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{usbPorts}">
                                Error en puertos USB
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Puertos HDMI</label>
                            <input type="number" th:field="*{hdmiPorts}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('hdmiPorts')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('hdmiPorts')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{hdmiPorts}">
                                Error en puertos HDMI
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Marca Monitor</label>
                            <input type="text" th:field="*{monitorBrand}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('monitorBrand')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('monitorBrand')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{monitorBrand}">
                                Error en monitor
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Pulgadas</label>
                            <input type="number" step="0.1" th:field="*{inches}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('inches')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('inches')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{inches}">
                                Error en pulgadas
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Precio ($)</label>
                            <input type="number" step="0.01" th:field="*{price}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                   required>
                            <div th:if="${#fields.hasErrors('price')}"
                                 class="alert alert-danger mt-2 py-1 px-2 small"
                                 th:errors="*{price}">
                                Error en precio
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success"
                                    th:text="${computer.id == null ? 'Guardar Registro' : 'Guardar Cambios'}"></button>

                            <a th:href="@{/computers/list}"
                               class="btn btn-secondary">Cancelar y Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
